        city: Stockholm
        houseNumber: "1"
    RouteRequest:
      title: RouteRequest
      required:
        - start
        - end
      type: object
      properties:
        start:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
            format: double
          description: Coordinate pair as [latitude, longitude].
        end:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
            format: double
          description: Coordinate pair as [latitude, longitude].
      example:
        start:
          - 59.3293
          - 18.0686
        end:
          - 59.3326
          - 18.0649
    RouteResponse:
      title: RouteResponse
      type: object
      description: GeoJSON route response proxied from OpenRouteService.
      additionalProperties: true
      properties:
        type:
          type: string
        features:
          type: array
          items:
            type: object
            additionalProperties: true
      example:
        type: FeatureCollection
        features:
          - type: Feature
            properties:
              summary:
                distance: 1200.5
                duration: 320.2
            geometry:
              type: LineString
              coordinates:
                - [18.0686, 59.3293]
                - [18.0649, 59.3326]
