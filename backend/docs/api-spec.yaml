openapi: 3.0.0
info:
  title: Felparkering API
  description: Rest API för att hantera felparkerade fordon
  version: '1.0'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    variables: {}
paths:
  /login:
    post:
      tags:
        - Auth
      summary: Login user
      description: |-
        ### POST /login

        Loggar in användare med e-post och lösenord.  
        Returnerar en JWT-token [`sub`: User ID, `claim`: User Role] som används för autentisering.
      operationId: Loginuser
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: admin@example.com
                password:
                  type: string
                  example: abc123
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                user:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6...
                message: User logged in successfully
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorMissingCredentials'
              examples:
                validationError:
                  summary: Validation error
                  value:
                    errors:
                      - field: email
                        message: Invalid email address
                missingCredentials:
                  summary: Missing credentials
                  value:
                    error: Missing credentials
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorInvalidCredentials'
                  - example:
                      error: Invalid credentials
              example:
                error: Invalid credentials
        '404':
          description: Not Found
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorNotFound'
                  - example:
                      error: User not found
              example:
                error: User not found
      deprecated: false
      security: []
  /register:
    post:
      tags:
        - Auth
      summary: Register new user
      description: |-
        ### POST /register

        Registrerar en användare (CUSTOMER) med e-post och lösenord.
        Returnerar en JWT-token [`sub`: User ID, `claim`: User Role] som används för autentisering.
      operationId: Registernewuser
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: admin@example.com
                password:
                  type: string
                  example: abc123
                confPassword:
                  type: string
                  example: abc123
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                  user: 
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6...
                  message: User registered successfully
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  summary: Validation error
                  value:
                    errors:
                      - field: email
                        message: Invalid email address
                missingCredentials: 
                  summary: Missing credentials
                  value:
                    error: Missing credentials
                passwordMismatch:
                  summary: Password and confirmation does not match
                  value:
                    error: Password and confirmation does not match
        '409':
          description: Conflict
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorConflict'
                  - example:
                      message: 
                      error: User already exists
              example:
                error: User already exists
      deprecated: false
  /reports:
    post:
      tags:
        - Reports
      summary: Create new report
      description: |-
        ### POST /reports

        Skapar en felparkeringsrapport.

        #### Behörighet:

        - `ADMIN`: Ja
            
        - `ATTENDANT`: Nej (403)
            
        - `CUSTOMER`: Ja
      operationId: Createnewreport
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  format: int64
                  example: 101
                street:
                  type: string
                  example: Södra vägen
                houseNumber:
                  type: string
                  example: "1"
                city:
                  type: string
                  example: Stockholm
                licensePlate:
                  type: string
                  example: ABC123
                category:
                  type: string
                  example: NO_PARKING_AREA
      responses:
        '201':
          description: Created
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCreatedResponse'
              example:
                message: Report created successfully
                report:
                  id: 12
                  address:
                    id: 101
                    longitude: 18.06
                    latitude: 59.33
                    street: Södra vägen
                    houseNumbers:
                      - "1"
                    city: Stockholm
                    distanceFromCity: 120
                  licensePlate: ABC123
                  category: NO_PARKING_AREA
                  attendantGroup:
                    id: 1
                    name: Stockholm Södra
                  assignedToId: null
                  createdOn: '2025-06-17T14:22:00Z'
                  updatedOn: '2025-06-17T14:22:00Z'
                  status: NEW
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorMissingCredentials'
                  - example:
                      error: Missing credentials
              example:
                error: Missing credentials
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorUnauthorized'
                  - example:
                      error: Missing or invalid token
              example:
                error: Missing or invalid token
        '403':
          description: Forbidden
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorAccessDenied'
                  - example:
                      error: You do not have permission to create a report
              example:
                error: You do not have permission to create a report
      deprecated: false
      security:
        - bearer: []
    get:
      tags:
        - Reports
      summary: Get all reports
      description: |-
        ### GET /reports

        Hämtar en lista med alla felparkeringsrapporter.

        #### Behörighet:

        Roll:

        - `ADMIN`: Ser alla rapporter
            
        - `ATTENDANT`: Ser endast rapporter för sin egen vaktgrupp
            
        - `CUSTOMER`: Ser endast rapporter som de har skapat
      operationId: Getallreports
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            default: createdOn
        - name: sortDir
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - NEW
              - ASSIGNED
              - RESOLVED
              - CANCELLED
        - name: assignedToId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedReportResponse'
              example:
                items:
                  - id: 12
                    address:
                      id: 101
                      street: Södra vägen
                      houseNumbers:
                        - "1"
                      city: Stockholm
                      latitude: 59.33
                      longitude: 18.06
                      distanceFromCity: 120
                    licensePlate: ABC123
                    category: NO_PARKING_AREA
                    attendantGroup:
                      id: 1
                      name: Stockholm Södra
                    assignedToId: 7
                    createdOn: '2025-06-17T14:22:00Z'
                    updatedOn: '2025-06-17T14:22:00Z'
                    status: NEW
                page: 0
                size: 10
                totalElements: 1
                totalPages: 1
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorUnauthorized'
                  - example:
                      error: Missing or invalid token
              example:
                error: Missing or invalid token
        '403':
          description: Forbidden
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorAccessDenied'
                  - example:
                      error: You do not have permission to get all reports
              example:
                error: You do not have permission to get all reports
      deprecated: false
      security:
        - bearer: []
  /reports/{id}:
    get:
      tags:
        - Reports
      summary: Get a report
      description: |-
        ### GET /reports/{id}

        Hämtar detaljerad information om en specifik felparkeringsrapport.

        #### Behörighet:

        - `ADMIN`: Har tillgång till alla rapporter
            
        - `ATTENDANT`: Har tillgång om rapporten tillhör samma vaktgrupp
            
        - `CUSTOMER`: Har tillgång om rapporten är skapad av användaren
            

        #### Parameter

        - `id` _(Long)_ – rapportens ID
      operationId: Getareport
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          style: simple
          schema:
            type: string
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Report'
                  - example:
                      id: 12
                      address:
                        id: 101
                        street: Södra vägen
                        houseNumbers:
                          - "1"
                        city: Stad
                        latitude: 59.3293
                        longitude: 18.0686
                        distanceFromCity: 120
                      licensePlate: ABC123
                      category: BLOCKERAR_UTFART
                      attendantGroup:
                        id: 1
                        name: Stockholm Södra
                      assignedToId: 7
                      createdOn: '2025-06-17T14:22:00Z'
                      updatedOn: '2025-06-17T14:22:00Z'
                      status: NEW
              example:
                id: 12
                address:
                  id: 101
                  street: Södra vägen
                  houseNumbers:
                    - "1"
                  city: Stad
                  latitude: 59.3293
                  longitude: 18.0686
                  distanceFromCity: 120
                licensePlate: ABC123
                category: BLOCKERAR_UTFART
                attendantGroup:
                  id: 1
                  name: Stockholm Södra
                assignedToId: 7
                createdOn: '2025-06-17T14:22:00Z'
                updatedOn: '2025-06-17T14:22:00Z'
                status: NEW
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorUnauthorized'
                  - example:
                      error: Missing or invalid token
              example:
                error: Missing or invalid token
        '403':
          description: Forbidden
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorAccessDenied'
                  - example:
                      error: You do not have permission to get a report
              example:
                error: You do not have permission to get a report
        '404':
          description: Not Found
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorNotFound'
                  - example:
                      error: Report not found
              example:
                error: Report not found
      deprecated: false
      security:
        - bearer: []
    put:
      tags:
        - Reports
      summary: Update report status
      description: |-
        ### PUT/reports/{id}

        Uppdaterar informationen för en specifik felanmälan, t.ex. ändrar dess status.

        #### Behörighet:

        - `ADMIN`: kan uppdatera status på alla rapporter
            
        - `ATTENDANT`: kan ändra status om rapporten tillhör deras vaktgrupp
            
        - `CUSTOMER`: kan ändra status på sina egna ärenden om de är aktiva till `CANCELLED`
            

        #### Parameter

        - `id` _(Long)_ – rapportens ID
      operationId: Updatereportstatus
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          style: simple
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - NEW
                    - ASSIGNED
                    - RESOLVED
                    - CANCELLED
            example:
              status: RESOLVED
      responses:
        '200':
          description: Updated
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportUpdatedResponse'
              example:
                message: Report updated successfully
                report:
                  id: 12
                  address:
                    id: 101
                    longitude: 18.06
                    latitude: 59.33
                    street: Södra vägen
                    houseNumbers:
                      - "1"
                    city: Stockholm
                    distanceFromCity: 120
                  licensePlate: ABC123
                  category: NO_PARKING_AREA
                  attendantGroup:
                    id: 1
                    name: Stockholm Södra
                  assignedToId: null
                  createdOn: '2025-06-17T14:22:00Z'
                  updatedOn: '2025-06-17T14:22:00Z'
                  status: NEW
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorBadRequest'
                  - $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                invalidStatus:
                  summary: Invalid status value
                  value:
                    error: Invalid request parameter or value
                missingStatus:
                  summary: Missing status
                  value:
                    errors:
                      - field: status
                        message: must not be null
        '403':
          description: Forbidden
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorAccessDenied'
                  - example:
                      error: You do not have permission to update a report
              example:
                error: You do not have permission to update a report
        '404':
          description: Not Found
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorNotFound'
                  - example:
                      error: Report not found
              example:
                error: Report not found
        '409':
          description: Conflict
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorConflict'
                  - example:
                      error: Report is already assigned to a different user
              example:
                error: Report is already assigned to a different user
      deprecated: false
      security:
        - bearer: []
  /addresses/search:
    get:
      tags:
        - Address
      summary: Search addresses
      description: |-
        ### GET /addresses/search

        Söker adresser baserat på gatunamn och returnerar ett förslag per husnummer.
      operationId: Searchaddresses
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressSuggestion'
              example:
                - id: 101
                  street: Södra vägen
                  city: Stockholm
                  houseNumber: "1"
                - id: 101
                  street: Södra vägen
                  city: Stockholm
                  houseNumber: "3"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
              example:
                error: Missing or invalid token
      deprecated: false
      security:
        - bearer: []
  /addresses/route:
    post:
      tags:
        - Address
      summary: Get route between two coordinates
      description: |-
        ### POST /addresses/route

        Hämtar en körbar rutt mellan två koordinatpunkter via extern route service.

        `start` och `end` anges som `[latitude, longitude]`.
      operationId: Getroute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
            example:
              start:
                - 59.3293
                - 18.0686
              end:
                - 59.3326
                - 18.0649
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
              example:
                type: FeatureCollection
                features:
                  - type: Feature
                    properties:
                      summary:
                        distance: 1200.5
                        duration: 320.2
                    geometry:
                      type: LineString
                      coordinates:
                        - [18.0686, 59.3293]
                        - [18.0649, 59.3326]
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
              example:
                error: Missing or invalid token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAccessDenied'
              example:
                error: Access Denied
      deprecated: false
      security:
        - bearer: []
  /admin/users:
    post:
      tags:
        - Admin
      summary: Create user
      description: |-
        ### POST /admin/users

        Skapar en användare, till exempel en parkeringsvakt.

        #### Behörighet:

        - `ADMIN`: Ja
            
        - `ATTENDANT`: Nej (403)
            
        - `CUSTOMER`: Nej (403)
      operationId: Createuser
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
            example:
              email: vakt@example.com
              password: secret123
              role: ATTENDANT
              attendantGroup:
                id: 1
                name: Stockholm Södra
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserCreatedResponse'
              example:
                user: 'User with id: 7 was created.'
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequest'
              example:
                error: Invalid request parameter or value
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorUnauthorized'
                  - example:
                      error: Missing or invalid token
              example:
                error: Missing or invalid token
        '403':
          description: Forbidden
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorAccessDenied'
                  - example:
                      error: You do not have permission to create a user
              example:
                error: You do not have permission to create a user
      deprecated: false
      security:
        - bearer: []
    get:
      tags:
        - Admin
      summary: Get all users
      description: |-
        ### GET /admin/users

        Hämtar en lista med alla användare.

        #### Behörighet:

        Roll:

        - `ADMIN`: ser alla användare
            
        - `ATTENDANT`: ej tillåten (403)
            
        - `CUSTOMER`: ej tillåten (403)
      operationId: Getallusers
      parameters: []
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsersResponse'
              example:
                users:
                  - id: 1
                    role: CUSTOMER
                  - id: 7
                    role: ATTENDANT
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorUnauthorized'
                  - example:
                      error: Missing or invalid token
              example:
                error: Missing or invalid token
        '403':
          description: Forbidden
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorAccessDenied'
                  - example:
                      error: You do not have permission to get all users
              example:
                error: You do not have permission to get all users
      deprecated: false
      security:
        - bearer: []
  /admin/users/{id}:
    delete:
      tags:
        - Admin
      summary: Delete user
      description: |-
        ### DELETE /admin/users/{id}

        Tar bort en användare med {id}.

        #### Behörighet:

        - `ADMIN`: Ja
            
        - `ATTENDANT`: ej tillåtet (403)
            
        - `CUSTOMER`: ej tillåtet (403)
            

        #### Parameter

        - `id` _(Long)_ – användarens ID
      operationId: Deleteuser
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          style: simple
          schema:
            type: string
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DeletedResponse'
                  - example:
                      message: User was successfully deleted
              example:
                message: User was successfully deleted
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorUnauthorized'
                  - example:
                      error: Missing or invalid token
              example:
                error: Missing or invalid token
        '403':
          description: Forbidden
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorAccessDenied'
                  - example:
                      error: You do not have permission to delete a user
              example:
                error: You do not have permission to delete a user
        '404':
          description: Not Found
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorNotFound'
                  - example:
                      error: User not found
              example:
                error: User not found
      deprecated: false
      security:
        - bearer: []
  /admin/attendants:
    get:
      tags:
        - Admin
      summary: Get all Attendant Groups
      description: |-
        ### GET /admin/attendants

        Hämtar en lista med alla vaktgrupper.

        #### Behörighet:

        Roll:

        - `ADMIN`: ser alla vaktgrupper
            
        - `ATTENDANT`: ej tillåten (403)
            
        - `CUSTOMER`: ej tillåten (403)
      operationId: GetallAttendantGroups
      parameters: []
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAttendantGroupsResponse'
              example:
                attendantGroups:
                  - name: Stockholm Södra
                    attendants:
                      - id: 7
                        role: ATTENDANT
                  - name: Stockholm Norra
                    attendants: []
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorUnauthorized'
                  - example:
                      error: Missing or invalid token
              example:
                error: Missing or invalid token
        '403':
          description: Forbidden
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorAccessDenied'
                  - example:
                      error: You do not have permission to get all attendant groups
              example:
                error: You do not have permission to get all attendant groups
      deprecated: false
      security:
        - bearer: []
components:
  schemas:
    LoginResponse:
      title: LoginResponse
      required:
        - user
        - message
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserDetailDto'
        message:
          type: string
      example:
        user:
          token: eyJhbGciOiJIUzI1NiIsInR5cCI6...
        message: User logged in successfully
    ValidationErrorResponse:
      title: ValidationErrorResponse
      required:
        - errors
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
